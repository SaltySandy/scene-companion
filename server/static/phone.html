<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Scene Companion</title>
  <style>
    :root { --bg: #000; --ink: #fff; --muted: #b8c0cc; --go: #ffd400; --stop: #ff3b30; --ok: #34c759; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 20px/1.4 -apple-system, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; gap: 14px; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
    h1 { margin: 0; font-size: 1.1rem; color: var(--muted); font-weight: 600; }
    #status { font-size: 1.3rem; font-weight: 700; min-height: 1.8em; }
    #wall { font-size: 1.1rem; font-weight: 800; padding: 6px 10px; border-radius: 8px; display: inline-block; background: #222; color: var(--muted); }
    #wall.clear { background: #0d3a1c; color: var(--ok); }
    #wall.approaching { background: #3d3200; color: var(--go); }
    #wall.too_close { background: #4a0d0a; color: var(--stop); }
    button { font: inherit; font-weight: 800; border: 0; border-radius: 22px; width: 100%; color: #000; }
    #start { flex: 1; min-height: 40vh; font-size: 2.6rem; background: var(--go); }
    #start.on { background: var(--stop); color: #fff; }
    .row { display: flex; gap: 12px; }
    .row button { min-height: 84px; font-size: 1.3rem; background: #2c2c2e; color: #fff; }
    #listen.on { background: var(--ok); color: #000; }
    #last { color: var(--muted); font-size: 1rem; min-height: 2.8em; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    details { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Scene Companion</h1>
  <div id="status" role="status" aria-live="polite">Tap Start to begin.</div>
  <div><span id="wall" aria-hidden="true">WALL: —</span></div>

  <button id="start" type="button" aria-label="Start. Turns on the camera and connects to the laptop.">Start</button>
  <div class="row">
    <button id="listen" type="button" aria-pressed="false" aria-label="Listen. Microphone off. Turn on, then ask a question like what is this.">Listen</button>
    <button id="ask" type="button" aria-label="What is this? Describes what the camera sees.">What is this?</button>
  </div>
  <div id="last" aria-hidden="true"></div>
  <details><summary>Debug</summary><div id="dbg"></div></details>

  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas" hidden></canvas>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const FPS = 4, MAX_SIDE = 640, JPEG_Q = 0.7, MIC_RATE = 16000;

  let ws = null, stream = null, frameTimer = null, wakeLock = null;
  let running = false, listening = false, reconnectTimer = null;
  let audioCtx = null, micNode = null, micSource = null;
  let speakingCount = 0;

  function status(t) { $("status").textContent = t; }
  function dbg(t) { const d = $("dbg"); d.textContent = (new Date().toLocaleTimeString() + " " + t + "\n" + d.textContent).slice(0, 2000); }

  // ---- SAW v1 binary envelope -------------------------------------------
  function envelope(kind, payload) {
    const head = new ArrayBuffer(20), v = new DataView(head);
    v.setUint8(0, 0x53); v.setUint8(1, 0x41); v.setUint8(2, 0x57); v.setUint8(3, 0x31); // "SAW1"
    v.setUint8(4, kind); v.setUint8(5, 0); v.setUint16(6, 0);
    v.setBigUint64(8, BigInt(Date.now())); v.setUint32(16, payload.byteLength);
    const out = new Uint8Array(20 + payload.byteLength);
    out.set(new Uint8Array(head), 0); out.set(new Uint8Array(payload), 20);
    return out.buffer;
  }
  function sendJson(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(Object.assign({ v: 1 }, obj))); }

  // ---- Speech (iOS needs a tap to unlock speechSynthesis) ----------------
  function speak(text, urgent) {
    if (!text) return;
    const synth = window.speechSynthesis;
    if (urgent) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    u.onstart = () => { speakingCount++; sendJson({ type: "speaking", active: true }); };
    const done = () => { speakingCount = Math.max(0, speakingCount - 1); if (!speakingCount) sendJson({ type: "speaking", active: false }); };
    u.onend = done; u.onerror = done;
    synth.speak(u);
    $("last").textContent = text;
  }
  function unlockSpeech() { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }

  // ---- WebSocket ----------------------------------------------------------
  function connect() {
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/stream";
    ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      sendJson({ type: "hello", role: "phone", app: "web-iphone", app_ver: "0.1.0" });
      const v = $("video");
      sendJson({ type: "config", width: v.videoWidth, height: v.videoHeight, fps: FPS, quality: Math.round(JPEG_Q * 100), mic: listening });
      status("Connected."); speak("connected");
      if (navigator.vibrate) navigator.vibrate(80);
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data !== "string") return; // audio clips not supported in the web client
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "say") { speak(m.text, !!m.urgent); if (m.urgent && navigator.vibrate) navigator.vibrate([200, 100, 200]); }
    };
    ws.onclose = () => {
      if (!running) return;
      status("Disconnected. Retrying…");
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => { if (running) connect(); }, 1500);
    };
    ws.onerror = () => dbg("websocket error");
  }

  // ---- Camera ---------------------------------------------------------------
  async function startCamera() {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    const v = $("video"); v.srcObject = stream; await v.play();
    const c = $("canvas"), ctx = c.getContext("2d");
    frameTimer = setInterval(() => {
      if (!ws || ws.readyState !== 1 || !v.videoWidth) return;
      if (ws.bufferedAmount > 64 * 1024) return; // drop, never queue
      const s = Math.min(1, MAX_SIDE / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
      ctx.drawImage(v, 0, 0, c.width, c.height);
      c.toBlob((b) => { if (b && ws && ws.readyState === 1) b.arrayBuffer().then((buf) => ws.send(envelope(0x01, buf))); }, "image/jpeg", JPEG_Q);
    }, 1000 / FPS);
  }

  // ---- Microphone -> PCM16 16 kHz mono, 100 ms chunks --------------------
  async function startMic() {
    const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    micSource = audioCtx.createMediaStreamSource(mic);
    micNode = audioCtx.createScriptProcessor(4096, 1, 1);
    const ratio = audioCtx.sampleRate / MIC_RATE;
    let pending = [];
    micNode.onaudioprocess = (e) => {
      if (!listening || !ws || ws.readyState !== 1 || speakingCount) return;
      const input = e.inputBuffer.getChannelData(0);
      for (let i = 0; i < input.length / ratio; i++) {
        const s = Math.max(-1, Math.min(1, input[Math.floor(i * ratio)]));
        pending.push(s < 0 ? s * 0x8000 : s * 0x7fff);
      }
      while (pending.length >= MIC_RATE / 10) {
        const chunk = new Int16Array(pending.splice(0, MIC_RATE / 10));
        ws.send(envelope(0x02, chunk.buffer));
      }
    };
    micSource.connect(micNode); micNode.connect(audioCtx.destination);
    micSource._stream = mic;
  }
  function stopMic() {
    try { micNode && micNode.disconnect(); micSource && micSource.disconnect(); } catch (e) {}
    if (micSource && micSource._stream) micSource._stream.getTracks().forEach((t) => t.stop());
    micNode = micSource = null;
  }

  // ---- Controls -------------------------------------------------------------
  async function start() {
    unlockSpeech();
    if (!window.isSecureContext) {
      status("This page must be opened with https:// for the camera to work.");
      speak("This page must be opened with h t t p s for the camera to work.");
      return;
    }
    try {
      status("Starting camera…");
      await startCamera();
    } catch (e) {
      status("Camera blocked. Allow camera access in Safari and try again."); dbg(e.message || e); return;
    }
    running = true;
    $("start").textContent = "Stop"; $("start").classList.add("on");
    $("start").setAttribute("aria-label", "Stop. Turns off the camera.");
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { dbg("no wake lock"); }
    connect();
  }
  function stop() {
    running = false; listening = false; setListenUi();
    clearInterval(frameTimer); clearTimeout(reconnectTimer);
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stopMic();
    if (ws) ws.close();
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    $("start").textContent = "Start"; $("start").classList.remove("on");
    $("start").setAttribute("aria-label", "Start. Turns on the camera and connects to the laptop.");
    status("Stopped."); speak("stopped");
  }
  function setListenUi() {
    $("listen").classList.toggle("on", listening);
    $("listen").setAttribute("aria-pressed", String(listening));
    $("listen").textContent = listening ? "Listening" : "Listen";
  }

  $("start").addEventListener("click", () => (running ? stop() : start()));
  $("listen").addEventListener("click", async () => {
    unlockSpeech();
    if (!running) { speak("Press Start first."); return; }
    listening = !listening;
    if (listening) {
      try { await startMic(); } catch (e) { listening = false; status("Microphone blocked."); dbg(e.message || e); }
    } else { stopMic(); }
    setListenUi();
    sendJson({ type: "config", mic: listening });
    speak(listening ? "Listening. Ask a question." : "Microphone off.");
  });
  $("ask").addEventListener("click", async () => {
    unlockSpeech();
    if (!running) { speak("Press Start first."); return; }
    try {
      await fetch("/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question: "What is this?" }) });
    } catch (e) { speak("Could not reach the laptop."); }
  });

  // Wall status for sighted testers (mirrors the laptop viewer).
  try {
    const vws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/viewer?frames=0");
    vws.onmessage = (ev) => {
      if (typeof ev.data !== "string") return;
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "wall" && m.level) {
        const el = $("wall"); el.className = m.level;
        el.textContent = "WALL: " + ({ clear: "CLEAR", approaching: "APPROACHING", too_close: "TOO CLOSE" })[m.level];
      }
    };
  } catch (e) {}

  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && running && !wakeLock) {
      try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
    }
  });
})();
</script>
</body>
</html>
